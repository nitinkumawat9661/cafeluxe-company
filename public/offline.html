<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080706" />
    <title>You're offline | TrustFirst Solutions</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; background: #030302; }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 20px;
        color: #fff7e8;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 50% 22%, rgba(200,155,69,.12), transparent 24rem),
          linear-gradient(145deg, #030302 0%, #080706 52%, #030302 100%);
      }
      .shell { width: min(42rem, 100%); text-align: center; }
      .animation {
        position: relative;
        width: clamp(7rem, 24vw, 10.5rem);
        aspect-ratio: 360 / 544;
        margin: 0 auto;
        overflow: hidden;
        border-radius: 1.65rem;
      }
      .fallback {
        position: absolute;
        z-index: 1;
        inset: 50% auto auto 50%;
        width: 62%;
        height: auto;
        transform: translate(-50%, -50%);
        border-radius: 1rem;
        filter: drop-shadow(0 0 24px rgba(200,155,69,.2));
      }
      video {
        position: absolute;
        z-index: 2;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .eyebrow {
        margin: 18px 0 0;
        color: #c89b45;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .28em;
        text-transform: uppercase;
      }
      .code {
        display: inline-flex;
        margin: 14px 0 0;
        padding: 6px 12px;
        border: 1px solid rgba(200,155,69,.28);
        border-radius: 999px;
        background: rgba(200,155,69,.055);
        color: #c89b45;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .18em;
      }
      h1 {
        margin: 14px auto 0;
        color: #f8efd9;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.25rem, 8vw, 4.2rem);
        font-weight: 600;
        line-height: .98;
        letter-spacing: -.035em;
      }
      p.message {
        max-width: 34rem;
        margin: 16px auto 0;
        color: #d6c8ae;
        font-size: 16px;
        line-height: 1.7;
      }
      .actions {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        margin-top: 24px;
      }
      button, a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 22px;
        border-radius: 999px;
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        border: 1px solid #c89b45;
        background: #c89b45;
        color: #080604;
      }
      a {
        border: 1px solid rgba(200,155,69,.4);
        background: rgba(255,255,255,.025);
        color: #f8efd9;
      }
      @media (min-width: 520px) {
        .actions { flex-direction: row; }
        button, a { min-width: 150px; }
      }
      @media (prefers-reduced-motion: reduce) {
        video { display: none; }
      }
    </style>
  </head>
  <body>
    <main class="shell" role="alert" aria-live="assertive">
      <div class="animation" aria-hidden="true">
        <img class="fallback" src="/trustfirst-logo-original.png" alt="" width="320" height="320" />
        <video
          src="/brand/trustfirst-brand-intro-v1.webm"
          poster="/brand/trustfirst-brand-poster-v1.webp"
          autoplay
          muted
          playsinline
          loop
          preload="metadata"
          onerror="this.style.display='none'"
        ></video>
      </div>
      <p class="eyebrow">Connection Lost</p>
      <p class="code">OFFLINE</p>
      <h1>You're offline</h1>
      <p class="message">Check your internet connection and retry when you're back online.</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Retry</button>
        <a href="/">Go to home</a>
      </div>
    </main>
    <script>
      window.addEventListener('online', function () {
        window.setTimeout(function () { location.reload(); }, 150);
      });
    </script>
  </body>
</html>
