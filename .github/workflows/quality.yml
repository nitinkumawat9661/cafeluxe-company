name: Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - seo/aeo-geo-sikar

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://trustfirstsolutions.in
        run: npm run build
